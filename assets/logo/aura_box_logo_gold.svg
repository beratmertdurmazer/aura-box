<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6B2" />
      <stop offset="25%" stop-color="#F3C77C" />
      <stop offset="50%" stop-color="#C59B4E" />
      <stop offset="75%" stop-color="#E8BC70" />
      <stop offset="100%" stop-color="#9A7029" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(60, 50)" filter="url(#subtleGlow)">
    <!-- Main Aura 4-Point Radiant Star -->
    <path d="M 50 10 Q 50 50 90 50 Q 50 50 50 90 Q 50 50 10 50 Q 50 50 50 10 Z" fill="url(#goldSheen)" />
    <!-- Companion Accent Star -->
    <path d="M 85 20 Q 85 32 97 32 Q 85 32 85 44 Q 85 32 73 32 Q 85 32 85 20 Z" fill="url(#goldSheen)" opacity="0.9" />
  </g>

  <!-- Bespoke Luxury Typography -->
  <text x="210" y="112" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="0.28em" 
        fill="url(#goldSheen)">AURA BOX</text>
</svg>

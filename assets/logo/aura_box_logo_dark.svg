<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <g transform="translate(60, 50)">
    <!-- Main Aura 4-Point Radiant Star -->
    <path d="M 50 10 Q 50 50 90 50 Q 50 50 50 90 Q 50 50 10 50 Q 50 50 50 10 Z" fill="url(#chromeGradient)" />
    <!-- Companion Accent Star -->
    <path d="M 85 20 Q 85 32 97 32 Q 85 32 85 44 Q 85 32 73 32 Q 85 32 85 20 Z" fill="url(#chromeGradient)" opacity="0.9" />
  </g>

  <!-- Bespoke Luxury Typography -->
  <text x="210" y="112" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="0.28em" 
        fill="url(#chromeGradient)">AURA BOX</text>
</svg>
